[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "mlruns",
    "mlartifacts",
    "src/outputs",
    "serving/logs",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
