name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: the default PyPI wheel on Linux pulls several GB
          # of unused CUDA/nvidia-* deps that only slow CI down.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
          pip install -r requirements.txt
          pip install -r serving/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build serving image
        run: docker build -t sentiment-serving:ci ./serving
